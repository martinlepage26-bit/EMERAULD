<title>Article 50, the cute version</title>
<style>
  :root {
    --bg: #EBE8DD;
    --panel: #F5F3EB;
    --ink: #23271F;
    --muted: #6B6A5A;
    --machine: #34606C;
    --machine-light: #CFE1E3;
    --human: #A85428;
    --human-light: #F0DCC9;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171A14; --panel: #1F2318; --ink: #ECE7D8; --muted: #9C9A88;
      --machine: #82B9C4; --machine-light: #223A3E; --human: #E1935E; --human-light: #3D2A1D;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171A14; --panel: #1F2318; --ink: #ECE7D8; --muted: #9C9A88;
    --machine: #82B9C4; --machine-light: #223A3E; --human: #E1935E; --human-light: #3D2A1D;
  }
  :root[data-theme="light"] {
    --bg: #EBE8DD; --panel: #F5F3EB; --ink: #23271F; --muted: #6B6A5A;
    --machine: #34606C; --machine-light: #CFE1E3; --human: #A85428; --human-light: #F0DCC9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); font-family: var(--sans); overflow-x: hidden; }
  main {
    max-width: 620px;
    margin: 0 auto;
    padding: clamp(20px, 5vw, 44px) clamp(16px, 4vw, 28px) 40px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 10px;
  }
  .card {
    background: var(--panel);
    border-radius: 18px;
    padding: clamp(14px, 3vw, 22px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  svg { width: 100%; height: auto; display: block; }
  .caption {
    font-family: var(--sans);
    font-weight: 800;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: clamp(1rem, 3.6vw, 1.3rem);
    line-height: 1.25;
    color: var(--ink);
    margin: 16px 4px 0;
    text-wrap: balance;
  }
  .caption .hl-m { color: var(--machine); }
  .caption .hl-h { color: var(--human); }
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 16px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .thumb { animation: nod 2.4s ease-in-out infinite; transform-origin: 145px 210px; }
    @keyframes nod { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-8deg)} }
    .shrug { animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    .glow { animation: pulse 1.8s ease-in-out infinite; transform-origin: 128px 150px; }
    @keyframes pulse { 0%,100%{opacity:0.55} 50%{opacity:1} }
    .qmark { animation: float 2.2s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  }
</style>

<main>
  <div class="eyebrow">EU AI Act &middot; Article 50 &middot; the cute version</div>
  <div class="card">
    <svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="leftHalf"><rect x="0" y="0" width="296" height="360" rx="16"/></clipPath>
        <clipPath id="rightHalf"><rect x="304" y="0" width="296" height="360" rx="16"/></clipPath>
      </defs>

      <!-- panel backgrounds -->
      <rect x="0" y="0" width="296" height="360" rx="16" fill="var(--machine-light)"/>
      <rect x="304" y="0" width="296" height="360" rx="16" fill="var(--human-light)"/>
      <line x1="300" y1="10" x2="300" y2="350" stroke="var(--ink)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.4"/>

      <!-- panel labels -->
      <text x="148" y="34" text-anchor="middle" font-family="var(--mono)" font-size="13" letter-spacing="1" fill="var(--machine)" font-weight="700">MACHINE-READABLE MARKING</text>
      <text x="452" y="34" text-anchor="middle" font-family="var(--mono)" font-size="13" letter-spacing="1" fill="var(--human)" font-weight="700">PERCEPTIBLE LABEL</text>

      <!-- ===== LEFT: happy robot finds the tag ===== -->
      <g>
        <!-- document -->
        <rect x="70" y="230" width="70" height="90" rx="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
        <line x1="82" y1="252" x2="128" y2="252" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
        <line x1="82" y1="266" x2="128" y2="266" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
        <line x1="82" y1="280" x2="112" y2="280" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>

        <!-- glowing watermark tag over the document -->
        <g class="glow">
          <circle cx="128" cy="150" r="22" fill="none" stroke="var(--machine)" stroke-width="2" opacity="0.5"/>
          <rect x="112" y="138" width="4" height="24" fill="var(--machine)"/>
          <rect x="119" y="138" width="7" height="24" fill="var(--machine)"/>
          <rect x="129" y="138" width="3" height="24" fill="var(--machine)"/>
          <rect x="135" y="138" width="6" height="24" fill="var(--machine)"/>
        </g>

        <!-- robot body -->
        <g class="thumb">
          <rect x="145" y="210" width="90" height="80" rx="20" fill="var(--machine)"/>
          <circle cx="190" cy="180" r="42" fill="var(--machine)"/>
          <circle cx="190" cy="120" r="6" fill="none" stroke="var(--machine)" stroke-width="4"/>
          <line x1="190" y1="126" x2="190" y2="140" stroke="var(--machine)" stroke-width="4"/>
          <!-- face plate -->
          <rect x="164" y="164" width="52" height="34" rx="10" fill="var(--panel)"/>
          <path d="M176 178 q4 -8 8 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M196 178 q4 -8 8 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M178 190 q12 8 24 0" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- magnifying glass arm -->
          <circle cx="128" cy="150" r="16" fill="none" stroke="var(--ink)" stroke-width="4"/>
          <line x1="139" y1="161" x2="152" y2="174" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
          <line x1="152" y1="174" x2="168" y2="196" stroke="var(--machine)" stroke-width="10" stroke-linecap="round"/>
          <!-- thumbs-up arm -->
          <line x1="232" y1="230" x2="252" y2="210" stroke="var(--machine)" stroke-width="10" stroke-linecap="round"/>
          <circle cx="256" cy="204" r="9" fill="var(--machine)"/>
          <rect x="250" y="192" width="7" height="16" rx="3" fill="var(--machine)"/>
        </g>
        <text x="150" y="335" text-anchor="middle" font-family="var(--sans)" font-weight="700" font-size="14" fill="var(--ink)">"Found it!"</text>
      </g>

      <!-- ===== RIGHT: confused person, no tag in sight ===== -->
      <g>
        <!-- same document, nothing on it -->
        <rect x="440" y="230" width="70" height="90" rx="6" fill="var(--panel)" stroke="var(--ink)" stroke-width="3"/>
        <line x1="452" y1="252" x2="498" y2="252" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
        <line x1="452" y1="266" x2="498" y2="266" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>
        <line x1="452" y1="280" x2="482" y2="280" stroke="var(--muted)" stroke-width="3" stroke-linecap="round"/>

        <g class="qmark">
          <text x="498" y="150" text-anchor="middle" font-family="var(--sans)" font-weight="800" font-size="46" fill="var(--human)">?</text>
        </g>

        <g class="shrug">
          <!-- person body -->
          <rect x="452" y="215" width="66" height="70" rx="24" fill="var(--human)"/>
          <circle cx="485" cy="185" r="38" fill="var(--human)"/>
          <!-- face -->
          <circle cx="473" cy="182" r="4" fill="var(--panel)"/>
          <circle cx="497" cy="182" r="4" fill="var(--panel)"/>
          <line x1="465" y1="170" x2="476" y2="174" stroke="var(--panel)" stroke-width="3" stroke-linecap="round"/>
          <path d="M472 200 q13 -6 26 0" stroke="var(--panel)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- shrugging arms -->
          <path d="M452 235 q-22 -6 -26 -30" stroke="var(--human)" stroke-width="10" fill="none" stroke-linecap="round"/>
          <path d="M518 235 q22 -6 26 -30" stroke="var(--human)" stroke-width="10" fill="none" stroke-linecap="round"/>
        </g>
        <text x="485" y="335" text-anchor="middle" font-family="var(--sans)" font-weight="700" font-size="14" fill="var(--ink)">"Found... nothing?"</text>
      </g>
    </svg>

    <p class="caption">The <span class="hl-m">marking</span> is for the machine.<br>The <span class="hl-h">label</span> is for the person.</p>
  </div>
  <footer>Companion cartoon &middot; EU AI Act Article 50 &middot; EMERAULD, 2026&#8209;08&#8209;03</footer>
</main>
