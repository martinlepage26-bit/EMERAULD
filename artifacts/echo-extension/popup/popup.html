<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ECHO Reader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="brand">ECHO</span>
    <span class="tagline">offline reader</span>
  </header>

  <div id="status" class="status">Checking page…</div>

  <div class="controls">
    <button id="play" class="primary" title="Read this page (Alt+R)">&#9654; Read page</button>
    <button id="pause" title="Pause / resume">&#10074;&#10074;</button>
    <button id="stop" title="Stop">&#9632;</button>
  </div>

  <div class="field">
    <label for="voice">Voice</label>
    <select id="voice"></select>
  </div>

  <div class="field slider">
    <label for="rate">Speed</label>
    <input id="rate" type="range" min="0.5" max="2.5" step="0.1">
    <span id="rate-value" class="value"></span>
  </div>

  <div class="field slider">
    <label for="pitch">Pitch</label>
    <input id="pitch" type="range" min="0" max="2" step="0.1">
    <span id="pitch-value" class="value"></span>
  </div>

  <div class="field slider">
    <label for="volume">Volume</label>
    <input id="volume" type="range" min="0" max="1" step="0.05">
    <span id="volume-value" class="value"></span>
  </div>

  <div class="field toggles">
    <label><input id="highlight" type="checkbox"> Highlight sentences</label>
    <label><input id="autoscroll" type="checkbox"> Auto-scroll</label>
  </div>

  <footer>
    Shortcuts: Alt+R play/pause &middot; Alt+. next &middot; Alt+, prev &middot; Alt+X stop
  </footer>

  <script src="popup.js"></script>
</body>
</html>
