# .github/workflows/deploy.yml
#
# PHAROS Suite — unified deploy pipeline
#
# Jobs:
#   test-backend   → pytest on every push/PR to main
#   deploy-backend → Railway deploy on push to main (backend/)
#   deploy-frontend→ Cloudflare Pages deploy on push to main (frontend/)
#
# Required secrets (Settings → Secrets → Actions):
#   RAILWAY_TOKEN          — from Railway dashboard → Account → API tokens
#   CLOUDFLARE_API_TOKEN   — CF API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — your CF account ID (from CF dashboard URL)
#   MONGO_URL              — mongodb+srv://... (used in test job smoke test)

name: PHAROS Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Job: Backend tests ────────────────────────────────────────────────────────
jobs:
  test-backend:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          # No real MONGO_URL in CI — server.py gracefully warns and skips DB seed
          MONGO_URL: ""
          RESEND_API_KEY: ""
        run: pytest tests/ -v --tb=short

  # ── Job: Deploy backend to Railway ─────────────────────────────────────────
  deploy-backend:
    name: Backend — Railway deploy
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # --service flag targets the backend service in your Railway project.
        # Set RAILWAY_SERVICE_NAME in repo vars if you want to override it.
        run: |
          railway up \
            --service "${RAILWAY_SERVICE_NAME:-pharos-backend}" \
            --detach \
            --ci

  # ── Job: Deploy frontend to Cloudflare Pages ───────────────────────────────
  deploy-frontend:
    name: Frontend — Cloudflare Pages deploy
    runs-on: ubuntu-latest
    # Frontend deploys independently of backend tests passing
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Inject backend URL at build time so the React bundle knows where to call
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL }}
          REACT_APP_ADMIN_PASSPHRASE: ${{ secrets.REACT_APP_ADMIN_PASSPHRASE }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # TODO: rename CF Pages project from govern-ai → pharos-ai in CF dashboard,
          # then update this value to match.
          projectName: pharos-ai
          directory: frontend/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
